# ssr-miloco — Docker-first deployment of SSR Agent + Xiaomi Miloco.
#
# This is the DEFAULT and recommended way to run ssr-miloco, and the ONLY
# supported way on Windows (Miloco cannot run natively on Windows).
#
#   docker compose up -d
#   docker compose exec miloco miloco-cli account bind      # bind Mi account
#   docker compose run --rm ssr channel config xiaomi       # configure a channel
#
# State persists in named volumes (miloco-data, ssr-data) so credentials,
# tokens, sessions and the home snapshot survive container recreation.

services:
  # ---- Xiaomi Miloco — the Mi Home perceptive gateway --------------------
  # Miloco is a separate project. Build it from its repository (cloned next to
  # this file or fetched by the Dockerfile) — see docker/miloco.Dockerfile.
  miloco:
    build:
      context: .
      dockerfile: docker/miloco.Dockerfile
      args:
        # Base image registry mirror (docker.1ms.run by default; see .env).
        BASE_IMAGE: ${BASE_IMAGE:-docker.1ms.run/library/python:3.11-slim}
        NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/library/node:20-slim}
    image: ssr-miloco/miloco:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Multimodal model keys used by Miloco (MiMo recommended).
      MILOCO_OMNI_API_KEY: ${MILOCO_OMNI_API_KEY:-}
    network_mode: host
    volumes:
      - miloco-data:/root/.miloco

  # ---- SSR Agent — gateway that serves a channel + the Miloco bus bridge --
  ssr:
    build:
      context: .
      dockerfile: docker/ssr.Dockerfile
      args:
        # The ssr-agent branch carrying the Miloco integration. Override to pin.
        SSR_REF: ${SSR_REF:-claude/fervent-galileo-psbk39}
        # Base image registry mirror (docker.1ms.run by default; see .env).
        BASE_IMAGE: ${BASE_IMAGE:-docker.1ms.run/library/python:3.11-slim}
    image: ssr-miloco/ssr:latest
    restart: unless-stopped
    depends_on:
      - miloco
    env_file:
      - .env
    environment:
      SSR_HOME: /data/.ssr
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini-3.1-flash-lite}
      # Reach Miloco through the host network.
      MILOCO_BASE_URL: ${MILOCO_BASE_URL:-http://host.docker.internal:1810}
      # Auto-discover Miloco's auto-generated Bearer token (server.token) from
      # its config.json on the shared volume — no manual copy needed. An explicit
      # MILOCO_API_KEY in .env still wins if set.
      MILOCO_CONFIG_FILE: /miloco-home/config.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ssr-data:/data
      # Read-only view of Miloco's home so ssr can read server.token.
      - miloco-data:/miloco-home:ro
    # Serve the configured gateway "home" (channel + Miloco activity→bus bridge).
    # Configure the channel first:  docker compose run --rm ssr channel config xiaomi
    # then install the gateway record:  docker compose run --rm ssr gateway install home --channel xiaomi --no-start
    command: ["gateway", "run", "home"]

volumes:
  miloco-data:
  ssr-data:
